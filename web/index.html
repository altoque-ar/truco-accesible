<style>
/* Layout: una columna, de arriba hacia abajo en el orden en que se lee con lector de pantalla:
   puntaje, mesa, tus cartas, opciones, lo que fue pasando. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --ink: #102017;
  --muted: #4c5c52;
  --felt: #17573a;
  --felt-ink: #f3faf5;
  --line: #c9d5cc;
  --accent: #b8501b;
  --focus: #ffbf47;
  --sword: #1d4f91; --club: #2c6b2f; --gold: #9a6b00; --cup: #a3262a;
  --font: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1410; --surface: #15211a; --ink: #eef5f0; --muted: #a9b9ae; --felt: #1e6a47; --felt-ink: #f3faf5; --line: #2b3d31;
    --accent: #f08a4b; --sword: #8fb6ff; --club: #8fd093; --gold: #f2c55c; --cup: #ff8f8f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1410; --surface: #15211a; --ink: #eef5f0; --muted: #a9b9ae; --felt: #1e6a47; --felt-ink: #f3faf5; --line: #2b3d31;
  --accent: #f08a4b; --sword: #8fb6ff; --club: #8fd093; --gold: #f2c55c; --cup: #ff8f8f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 400 18px/1.5 var(--font); margin: 0;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 28px; margin: 0; letter-spacing: .01em; }
h2 { font-size: 20px; margin: 0 0 8px; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.score b { display: block; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: 15px; }

.mesa { background: var(--felt); color: var(--felt-ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.mesa h2 { color: var(--felt-ink); }
.jugadas { display: flex; flex-wrap: wrap; gap: 10px; min-height: 64px; align-items: center; }
.jugada { background: rgba(255,255,255,.12); border-radius: 10px; padding: 6px 10px; font-size: 16px; }
.jugada small { display: block; opacity: .85; font-size: 13px; }
.estado { font-size: 17px; }

.cartas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.carta {
  aspect-ratio: 5 / 7; max-width: 100%; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center;
}
.carta .n { font-size: clamp(30px, 9vw, 46px); font-weight: 700; line-height: 1; }
.carta .p { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.carta.espada .n, .carta.espada .p { color: var(--sword); }
.carta.basto .n, .carta.basto .p { color: var(--club); }
.carta.oro .n, .carta.oro .p { color: var(--gold); }
.carta.copa .n, .carta.copa .p { color: var(--cup); }
.carta.sel { border-color: var(--accent); border-width: 3px; }
.carta:disabled { opacity: .45; cursor: default; }
.carta.vacia { border-style: dashed; color: var(--muted); }

.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.op { background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 10px 14px; min-height: 48px; font-weight: 700; }
.op.fuerte { background: var(--accent); border-color: var(--accent); color: #fff; }
/* Tres lugares fijos debajo de las cartas: izquierda, centro y derecha. */
.opciones.barra3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.op.slot { min-height: 60px; padding: 10px 6px; font-size: 17px; line-height: 1.2; }
.op[aria-disabled="true"] { opacity: .4; }
.aviso { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-weight: 700; }

.inicio { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; }
legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
label { display: inline-flex; gap: 8px; align-items: center; min-height: 40px; }
input[type=radio] { width: 22px; height: 22px; accent-color: var(--felt); }
.empezar { background: var(--felt); color: var(--felt-ink); border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 700; font-size: 20px; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
summary { font-weight: 700; cursor: pointer; min-height: 32px; }
ol.log { margin: 8px 0 0; padding-left: 22px; max-height: 260px; overflow-y: auto; font-size: 16px; }
.ayuda { font-size: 16px; color: var(--muted); }
.ayuda kbd { font: 700 15px var(--font); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.barra { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.frases { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
.frases li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.frases button { padding: 8px 12px; font-size: 16px; }
.menu { background: var(--surface); border: 3px solid var(--accent); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.menu p { font-weight: 700; }
.menu button { text-align: left; background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; min-height: 48px; font-weight: 700; }
.menu button:focus-visible, .menu button:focus { border-color: var(--accent); }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-weight: 700; }
.campo input { font: inherit; font-size: 18px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.campo input:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.asientos { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
#t-online { margin-top: 18px; }
/* ---------------- Capa visual (solo para los que ven: todo es aria-hidden) ---------------- */
.cartas { display: flex; justify-content: center; gap: 10px; }
.cartas .carta { flex: 0 1 118px; min-width: 0; }
.carta { background: none; border: 0; padding: 0; width: 100%; max-width: 118px; touch-action: pan-x; transition: transform .15s; }
.carta .dib { display: block; width: 100%; height: 100%; border-radius: 9px; transition: transform .15s, box-shadow .15s; }
.carta .dib svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0,0,0,.28)); }
.carta.sel { border: 0; }
.carta.sel .dib { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--accent); }
.carta.arrastra { transition: none; }
.carta.vacia { border: 2px dashed var(--line); border-radius: 12px; }
.carta.reparte { animation: reparto .45s cubic-bezier(.2,.8,.3,1) both; }
@keyframes reparto { from { transform: translateY(-160px) rotate(-10deg) scale(.7); opacity: 0; } }

.pano { position: relative; height: 300px; border-radius: 14px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, #23855a 0%, #176a42 45%, #0f4e30 100%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), inset 0 8px 28px rgba(0,0,0,.35); }
.pano.de4 { height: 350px; }
.pano .capa, .pano .globos { position: absolute; inset: 0; }
.pano .globos { pointer-events: none; }
.asiento { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #f3faf5; font-size: 13px; font-weight: 700; }
.asiento.arriba { top: 8px; left: 50%; transform: translateX(-50%); }
.asiento.abajo { bottom: 8px; left: 50%; transform: translateX(-50%); }
.asiento.izq { left: 6px; top: 50%; transform: translateY(-50%); }

      .catch(() => { if (Date.now() - t0 > 120000) { decir("No pude volver a conectarme. Revisá internet y volvé a entrar a la mesa.", true); salirOnlineLocal(); return; } reintento = setTimeout(probar, 2000); });
  };
  reintento = setTimeout(probar, 800);
}
async function entrarOnline(primero, esperando) {
  const nombre = $("#nombre").value.trim();
  if (!nombre) { decir("Escribí tu nombre primero.", true); $("#nombre").focus(); return; }
  guardar("truco-nombre", nombre);
  audio();
  if (ONLINE) dejarMesa();
  decir(esperando, true);
  ONLINE = { sala: null, token: null, host: false, saliendo: false };
  try { await conectar({ ...primero, nombre }); }
  catch (e) { ONLINE = null; decir("No me pude conectar al servidor del truco. Revisá que tengas internet y probá de nuevo.", true); }
}
function crearMesa() {
  const cfg = { jugadores: Number(valor("jug")), puntos: Number(valor("pts")), flor: valor("flor") === "si" };
  entrarOnline({ t: "crear", cfg }, "Creando la mesa.");
}
function unirmeMesa() {
  const c = $("#codigo").value.replace(/\D/g, "");
  if (c.length !== 4) { decir("El código de la mesa tiene 4 números.", true); $("#codigo").focus(); return; }
  entrarOnline({ t: "unirse", sala: c }, "Entrando a la mesa.");
}
function dejarMesa() {
  if (!ONLINE) return;
  ONLINE.saliendo = true; clearTimeout(reintento); reintento = null;
  try { enviar({ t: "salir" }); } catch (e) {}
  const w = ws; ws = null; setTimeout(() => { try { w && w.close(); } catch (e) {} }, 200);
  guardar("truco-mesa", null);
  ONLINE = null; YO = 0;
}
function salirOnlineLocal() { if (ONLINE) ONLINE.saliendo = true; ONLINE = null; S = null; YO = 0; $("#juego").hidden = true; $("#sala").hidden = true; $("#inicio").hidden = false; musica("musica-menu"); $("#crear").focus(); }
const deletreo = (c) => String(c).split("").join(" ");
// Une cada carta tirada con su carta de la mano (para que el motor sepa cuáles te quedan).
function enlazar(v) {
  const r = v.ronda;
  r.jugadas = r.jugadas.map((js, q) => js.map((c) => r.cartas[q].find((x) => x.n === c.n && x.p === c.p) || c));
  r.cartas = r.cartas.map((cs, q) => q === v.yo ? cs : r.jugadas[q]);
  v.eventos = [];
  return v;
}
function manejar(m) {
  if (!ONLINE && m.t !== "perdida") return;
  if (m.t === "sala") return mostrarSala(m);
  if (m.t === "juego") return llegaJuego(m);
  if (m.t === "aviso") return decir(m.texto);
  if (m.t === "error") { decir(m.texto, true); if (!ONLINE.sala) { const o = ONLINE; o.saliendo = true; ONLINE = null; try { ws && ws.close(); } catch (e) {} } if (S) pintar(); return; }
  if (m.t === "senas") { senaComp = m.lista.slice(); return; }
  if (m.t === "sena") {
    if (m.k === "nada") senaComp = ["nada"]; else { senaComp = senaComp.filter((x) => x !== "nada" && x !== m.k); senaComp.push(m.k); }
    decir("Seña de " + m.de + "."); return;
  }
  if (m.t === "perdida") { decir(m.texto || "La mesa ya no existe.", true); guardar("truco-mesa", null); salirOnlineLocal(); return; }
}
function textoAsiento(a, i, m) {
  const eq = m.cfg.jugadores === 4 ? (i % 2 === m.yo % 2 ? "tu equipo" : "equipo rival") + ", " : "";
  if (!a) return `Lugar ${i + 1}, ${eq}libre.`;
  const quien = i === m.yo ? a.nombre + " (vos)" : a.nombre;
  const extra = a.fuera ? ", se fue" : !a.conectado ? ", desconectado" : a.reemplazo && m.estado !== "espera" ? ", juega " + a.reemplazo + " por él" : "";
  return `Lugar ${i + 1}, ${eq}${quien}${a.nombre === m.hostNombre ? ", creó la mesa" : ""}${extra}.`;
}
function mostrarSala(m) {
  const nueva = ONLINE.sala !== m.sala;
  Object.assign(ONLINE, { sala: m.sala, token: m.token, host: m.host, cfg: m.cfg, estado: m.estado });
  ONLINE.nombreHost = m.hostNombre;
  ONLINE.hostAsiento = Math.max(0, m.asientos.findIndex((a) => a && a.nombre === m.hostNombre));
  guardar("truco-mesa", JSON.stringify({ sala: m.sala, token: m.token }));
  YO = m.yo;
  $("#sala-titulo").textContent = "Mesa " + m.sala;
  $("#sala-datos").textContent = `De a ${m.cfg.jugadores}, a ${m.cfg.puntos}, ${m.cfg.flor ? "con" : "sin"} flor.`;
  $("#asientos").innerHTML = "";
  m.asientos.forEach((a, i) => { const li = document.createElement("li"); li.textContent = textoAsiento(a, i, m); $("#asientos").appendChild(li); });
  const libres = m.asientos.filter((a) => !a).length;
  $("#sala-empezar").hidden = !m.host;
  $("#sala-empezar").textContent = libres ? `Empezar ya (${libres === 1 ? "el lugar libre lo ocupa uno de la casa" : "los " + libres + " lugares libres los ocupan los de la casa"})` : "Empezar la partida";
  $("#sala-espera").hidden = m.host;
  $("#sala-espera").textContent = "Esperando que " + (ONLINE.nombreHost || "el que creó la mesa") + " empiece la partida.";
  $("#sala-equipo").hidden = m.cfg.jugadores !== 4;
  if (m.estado === "espera") {
    const veniaJugando = !$("#juego").hidden;
    if (veniaJugando) { S = null; musica("musica-menu"); }
    if ($("#sala").hidden) {
      $("#inicio").hidden = true; $("#juego").hidden = true; $("#sala").hidden = false;
      if (veniaJugando) decir("Revancha. Mesa " + deletreo(m.sala) + ".", true);
      else if (m.host && nueva) decir(`Mesa creada. El código es ${deletreo(m.sala)}. Pasáselo a tus amigos.`, true);
      else if (nueva) decir(`Entraste a la mesa de ${ONLINE.nombreHost}.`, true);
      ($("#sala-empezar").hidden ? $("#sala-codigo") : $("#sala-empezar")).focus();
    }
  }
}
function llegaJuego(m) {
  YO = m.yo;
  const primera = !S || $("#juego").hidden;
  S = enlazar({ ...m.vista, yo: m.yo });
  if (primera) {
    audio(); musica("musica-juego");
    sel = 0; salgoYo = false; focoNuevaMano = true;
    $("#cartas").dataset.clave = ""; $("#opciones").dataset.clave = "";
    $("#log").innerHTML = "";
    $("#inicio").hidden = true; $("#sala").hidden = true; $("#juego").hidden = false;
    $("#nueva").textContent = "Salir de la mesa";
    if (m.inicio && !m.evs.length) decir("Volviste a la mesa. " + estadoTexto(), true);
    else if (S.cfg.jugadores === 4) decir(`Empieza la partida a ${S.cfg.puntos}, ${S.cfg.flor ? "con" : "sin"} flor. Tu compañero es ${S.nombres[(YO + 2) % 4]}.`);
    else decir(`Empieza la partida a ${S.cfg.puntos}, ${S.cfg.flor ? "con" : "sin"} flor, contra ${S.nombres[1 - YO]}.`);
  } else if (m.inicio && !m.evs.length) {
    decir("Conexión recuperada. " + estadoTexto(), true);
  }
  if (m.evs.some((e) => e.tipo === "reparto")) { sel = 0; salgoYo = false; focoNuevaMano = true; }
  procesar(m.evs);
  bots();
}
$("#crear").addEventListener("click", crearMesa);
$("#unirme").addEventListener("click", unirmeMesa);
$("#codigo").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); unirmeMesa(); } });
$("#sala-empezar").addEventListener("click", () => enviar({ t: "empezar" }));
$("#sala-equipo").addEventListener("click", () => enviar({ t: "equipo" }));
$("#sala-codigo").addEventListener("click", () => decir(`El código de la mesa es ${deletreo(ONLINE ? ONLINE.sala : "")}.`, true));
$("#sala-lugares").addEventListener("click", () => decir([...$("#asientos").children].map((li) => li.textContent).join(" "), true));
$("#sala-salir").addEventListener("click", () => volver());
$("#nombre").value = leer("truco-nombre") || "";
// Si se cortó la luz o se cerró la ventana en medio de una partida online, al abrir se ofrece volver.
(() => {
  let g = null; try { g = JSON.parse(leer("truco-mesa") || "null"); } catch (e) {}
  if (!g || !g.sala) return;
  $("#volver-mesa").hidden = false;
  $("#volver-mesa").textContent = "Volver a la mesa " + g.sala;
  $("#volver-mesa").addEventListener("click", async () => {
    audio();
    ONLINE = { sala: g.sala, token: g.token, host: false, saliendo: false };
    $("#volver-mesa").hidden = true;
    try { await conectar({ t: "volver", sala: g.sala, token: g.token }); }
    catch (e) { ONLINE = null; decir("No me pude conectar al servidor del truco.", true); }
  });
})();
if (PRUEBA) Object.assign(window.__truco, { online: () => ONLINE, yo: () => YO, cortar: () => ws && ws.close(), senas: () => senaComp.slice() });

document.addEventListener("keydown", (e) => {
  if (!S || e.altKey || e.ctrlKey || e.metaKey) return;
  // Mientras se mezcla no se puede jugar, cantar ni mirar las cartas.
  if (mezclando() && !$("#juego").hidden && e.key !== "Tab") { e.preventDefault(); e.stopPropagation(); return; }
  // Con un menú abierto, las flechas lo recorren, Enter elige y Escape lo cierra.
  if (!$("#menu").hidden) {
    const items = [...$("#menu-items").children], i = items.indexOf(document.activeElement), n = items.length;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); items[(i + 1) % n].focus(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); items[(i - 1 + n) % n].focus(); }
    else if (e.key === "Home") { e.preventDefault(); items[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); items[n - 1].focus(); }
    else if (e.key === "Escape" || e.key === "Esc" || e.key === "Tab" || e.key === "Backspace") { e.preventDefault(); e.stopPropagation(); cerrarMenu(true); }
    // La misma tecla que abrió el menú lo cierra (Shift E o Shift S).
    else if (e.shiftKey && ((e.key.toLowerCase() === "e" && menuAbierto === "Envido") || (e.key.toLowerCase() === "f" && menuAbierto === "Flor") || (e.key.toLowerCase() === "s" && menuAbierto !== "Envido" && menuAbierto !== "Flor"))) { e.preventDefault(); cerrarMenu(true); }
    else if (e.key !== "Enter" && e.key !== " ") e.preventDefault();
    return;
  }
  const enCartas = $("#cartas").contains(document.activeElement);
  if (enCartas && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    e.preventDefault();
    const bs = cartasBtn(), n = bs.length; if (!n) { decir("No te quedan cartas.", true); return; }
    sel = (sel + (e.key === "ArrowRight" ? 1 : n - 1)) % n; marcar(); bs[sel].focus();
    // Con una sola carta el foco no cambia y el lector no la vuelve a leer: la digo yo.
    if (n === 1) decir(mayus(nombreCarta(manoDe(S, YO)[0])) + ".", true);
    return;
  }
  // Flecha arriba o abajo: repite la carta en la que estás parado.
  if (enCartas && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault();
    const m = manoDe(S, YO); if (!m.length) { decir("No te quedan cartas.", true); return; }
    decir(mayus(nombreCarta(m[Math.min(sel, m.length - 1)])) + ".", true);
    return;
  }
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k === "p") { e.preventDefault(); decir(`Van ${S.puntos[NOS()]} a ${S.puntos[1 - NOS()]}. Se juega a ${S.cfg.puntos}.`, true); }
  else if (k === "m" && !e.shiftKey) { e.preventDefault(); decir(textoMesa(), true); }
  else if (k === "c") { e.preventDefault(); const m = manoDe(S, YO); decir(m.length ? "Tus cartas: " + m.map(nombreCarta).join(", ") + "." : "No te quedan cartas.", true); }
  else if (k === "a") { e.preventDefault(); decir(textoRival(), true); }
  else if (k === "e" && e.shiftKey) { e.preventDefault(); menuEnvido(); }
  else if (k === "e") { e.preventDefault(); decir(`Tenés ${envidoDe(S.ronda.cartas[YO])} de envido. ` + (puedeEnvido() ? "Todavía lo podés cantar." : (S.ronda.envido.estado !== "nada" ? "El envido ya se jugó en esta mano." : "Ya no se puede cantar envido en esta mano.")), true); }
  else if (k === "h") { e.preventDefault(); decir(AYUDA_VOZ, true); }
  else if (k === "m" && e.shiftKey) { e.preventDefault(); atajo(["mazo"], "irte al mazo"); }
  else if (k === "t" && e.shiftKey) { e.preventDefault(); atajo(["truco", "retruco", "vale_cuatro"], "cantar truco"); }
  else if (k === "t") { e.preventDefault(); decir(estadoTexto(), true); }
  else if (k === "f" && e.shiftKey) { e.preventDefault(); teclaFlor(); }
  else if (k === "s" && e.shiftKey) { e.preventDefault(); menuSenas(); }
  else if (k === "s") { e.preventDefault(); decirSenas(); }
  else if (k === "q") { e.preventDefault(); atajo(["quiero", "contraflor"], "decir quiero"); }
  else if (k === "n") { e.preventDefault(); atajo(["no_quiero", "achico"], "decir no quiero"); }
  else if (k === "1" || k === "2" || k === "3") { e.preventDefault(); decir(textoBaza(Number(k) - 1), true); }
  else if (k === "r") { e.preventDefault(); const u = ultimo; ultimo = ""; decir(u, true); }
});

// ---------------------------------------------------------------- versión nueva
// En la app de la compu (el juego abierto como archivo) se fija si hay una versión más nueva en internet.
// La app la baja sola y la usa la próxima vez que se abre. En la web no hace falta: siempre está al día.
const VERSION = Number((document.querySelector('meta[name="truco-version"]') || {}).content || 0);
if (location.protocol === "file:" && !PRUEBA) {
  setTimeout(() => {
    fetch("https://raw.githubusercontent.com/altoque-ar/truco-accesible/main/version.json?t=" + Date.now())
      .then((r) => r.ok ? r.json() : null)
      .then((v) => { if (v && Number(v.version) > VERSION) decir("Hay una versión nueva del Truco. Se va a usar la próxima vez que abras el juego."); })
      .catch(() => {});
  }, 4000);
}
